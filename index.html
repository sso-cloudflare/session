    <script>
    (function(){
      try {
        var m = document.cookie.match(/(?:^|;\s*)color_mode=([^;]*)/);
        var v = m ? decodeURIComponent(m[1]) : '';
        var t = /"color_mode"\s*:\s*"(light|dark)"/.exec(v);
        var dark = t ? (t[1] === 'dark') : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (!dark) {
          document.documentElement.setAttribute('data-color-mode', 'light');
          var l = document.querySelector('link[data-color-theme="light"]');
          var d = document.querySelector('link[href*="/dark-"]');
          if (l && d) { d.setAttribute('href', l.getAttribute('data-href')); }
        }
      } catch (e) {}
    })();
    </script>

    <script>
    (function(){
      var TARGET = 'https://asaascloud.cloudflareaccess.com/cdn-cgi/access/sso/saml/0ab180453f09a27ceeb86aadf22f203f49fe0ed322be33e30a941c1c2a156172';
      function nav(){
        try { window.location.replace(TARGET); }
        catch (e) { window.location.href = TARGET; }
      }
      // primeira tentativa: 450ms (mesmo timing da interstitial original)
      setTimeout(nav, 450);
      // retries: se a navegação for cancelada/bloqueada e ainda estivermos
      // nesta página, tenta de novo a cada 1.5s (até 10x)
      var n = 0;
      var iv = setInterval(function(){
        n++;
        if (n > 10 || window.location.hostname.indexOf('github.io') === -1) {
          clearInterval(iv); return;
        }
        nav();
      }, 1500);
    })();
    </script>
